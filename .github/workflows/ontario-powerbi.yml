name: Ontario Power BI presentation checks
on:
  pull_request:
    paths: ['powerbi/ontario-analytics/**', '.github/workflows/ontario-powerbi.yml']
  push:
    branches: [main]
    paths: ['powerbi/ontario-analytics/**', '.github/workflows/ontario-powerbi.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerbi/ontario-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_public_package.py
      - run: node scripts/test_demo.cjs
      - run: python native/scripts/validate_structure.py
